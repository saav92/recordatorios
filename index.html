<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Recordatorios">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>Recordatorios</title>
  <style>
    :root {
      --dark:   #1d1d1f;
      --card:   #2c2c2e;
      --input:  #3a3a3c;
      --text:   #f5f5f7;
      --muted:  #8e8e93;
      --red:    #ef4444;
      --orange: #f97316;
      --indigo: #6366f1;
      --green:  #22c55e;
      --green-bg:#071a10;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html { height:100%; -webkit-text-size-adjust:100%; }
    body {
      min-height:100%; min-height:-webkit-fill-available;
      background:var(--dark); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
      overscroll-behavior:none; -webkit-font-smoothing:antialiased;
    }

    /* ── HEADER ── */
    header { background:#000; position:sticky; top:0; z-index:100; padding-top:env(safe-area-inset-top); }
    .header-inner { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; }
    .header-title { font-size:20px; font-weight:700; letter-spacing:-0.4px; }
    .badge { font-size:12px; font-weight:600; color:var(--muted); background:#1c1c1e; padding:4px 12px; border-radius:20px; }

    /* ── MAIN ── */
    main { padding:20px 16px calc(env(safe-area-inset-bottom) + 32px); }

    /* ── FORM ── */
    .form-card { background:var(--card); border-radius:18px; padding:18px 16px 16px; margin-bottom:24px; }
    .field { margin-bottom:13px; }
    .field-label { display:block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:7px; }

    input[type="text"], input[type="time"] {
      width:100%; background:var(--input); border:1.5px solid transparent;
      border-radius:11px; color:var(--text); font-size:16px; font-family:inherit;
      padding:12px 14px; -webkit-appearance:none; outline:none; transition:border-color .18s;
    }
    input[type="text"]::placeholder { color:#636366; }
    input[type="text"]:focus, input[type="time"]:focus { border-color:var(--indigo); }
    input[type="text"].error { border-color:var(--red) !important; }
    input[type="time"]::-webkit-calendar-picker-indicator { filter:invert(1) brightness(.5); }

    /* ── CATEGORY SCROLL ── */
    .cat-scroll {
      display:flex; gap:8px; overflow-x:auto;
      -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:2px;
    }
    .cat-scroll::-webkit-scrollbar { display:none; }

    .cat-pill {
      flex-shrink:0; padding:9px 14px; border-radius:100px;
      border:1.5px solid var(--input); background:transparent;
      color:var(--muted); font-size:13px; font-weight:600; font-family:inherit;
      cursor:pointer; -webkit-appearance:none; white-space:nowrap;
      transition:all .18s;
    }
    .cat-pill:active { transform:scale(.93); }

    /* ── PRIORITY SELECTOR ── */
    .pri-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
    .pri-btn {
      padding:10px 0; border-radius:10px; border:1.5px solid var(--input);
      background:transparent; color:var(--muted); font-size:13px; font-weight:600;
      font-family:inherit; cursor:pointer; -webkit-appearance:none;
      display:flex; align-items:center; justify-content:center; gap:5px; transition:all .18s;
    }
    .pri-btn.active[data-pri="baja"]  { border-color:var(--indigo); color:var(--indigo); background:rgba(99,102,241,.1); }
    .pri-btn.active[data-pri="media"] { border-color:var(--orange);  color:var(--orange);  background:rgba(249,115,22,.1); }
    .pri-btn.active[data-pri="alta"]  { border-color:var(--red);     color:var(--red);     background:rgba(239,68,68,.1); }
    .pri-btn:active { transform:scale(.95); }

    /* ── ADD BUTTON ── */
    .btn-add {
      width:100%; margin-top:4px; padding:15px;
      background:var(--indigo); color:#fff; border:none; border-radius:13px;
      font-size:16px; font-weight:700; font-family:inherit;
      cursor:pointer; -webkit-appearance:none; transition:opacity .15s, transform .1s;
    }
    .btn-add:active { opacity:.82; transform:scale(.98); }

    /* ── FILTER BAR ── */
    .filter-wrap { margin-bottom:16px; }
    .filter-label { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:9px; }

    /* ── SECTION HEADER ── */
    .section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:13px; }
    .section-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.9px; color:var(--muted); }
    .btn-clear { font-size:12px; font-weight:600; color:var(--red); background:transparent; border:none; cursor:pointer; -webkit-appearance:none; font-family:inherit; }

    /* ── EMPTY ── */
    .empty { text-align:center; padding:52px 20px 40px; }
    .empty-icon { font-size:44px; margin-bottom:14px; }
    .empty-title { font-size:17px; font-weight:600; margin-bottom:5px; }
    .empty-sub { font-size:14px; color:var(--muted); }

    /* ── LIST ── */
    .list { display:flex; flex-direction:column; gap:10px; }

    /* ── CARD WRAPPER ── */
    .card-wrap {
      position:relative; border-radius:14px; overflow:hidden;
      animation:slideIn .28s cubic-bezier(.34,1.2,.64,1) both;
    }
    .card-wrap.removing { animation:slideOut .22s ease forwards; }
    @keyframes slideIn { from{opacity:0;transform:translateY(-14px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }
    @keyframes slideOut { to{opacity:0;transform:translateX(-100%) scaleY(.7);max-height:0;margin:0} }

    .card-del-bg {
      position:absolute; inset:0; background:var(--red);
      display:flex; align-items:center; justify-content:flex-end;
      padding-right:22px; border-radius:14px;
    }

    /* ── CARD ── */
    .card {
      position:relative; background:var(--card); border-radius:14px;
      padding:13px 14px 13px 16px; display:flex; align-items:flex-start; gap:12px;
      border-left:4px solid var(--indigo); transition:background .22s, border-color .22s;
      will-change:transform;
    }
    .card[data-pri="media"] { border-left-color:var(--orange); }
    .card[data-pri="alta"]  { border-left-color:var(--red); }
    .card.done { background:var(--green-bg); border-left-color:var(--green) !important; }

    .btn-toggle {
      flex-shrink:0; width:26px; height:26px; border-radius:50%;
      border:2px solid var(--indigo); background:transparent; color:#fff;
      font-size:13px; font-weight:700; cursor:pointer; -webkit-appearance:none;
      display:flex; align-items:center; justify-content:center;
      transition:background .2s, border-color .2s; margin-top:1px;
    }
    .card[data-pri="media"] .btn-toggle { border-color:var(--orange); }
    .card[data-pri="alta"]  .btn-toggle { border-color:var(--red); }
    .card.done .btn-toggle { background:var(--green); border-color:var(--green); }
    .btn-toggle:active { transform:scale(.88); }

    .card-content { flex:1; min-width:0; }
    .card-text { font-size:15px; font-weight:500; word-break:break-word; line-height:1.4; transition:color .22s; }
    .card.done .card-text { text-decoration:line-through; color:var(--muted); }

    .card-tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:5px; }
    .tag {
      font-size:10px; font-weight:700; text-transform:uppercase;
      letter-spacing:.5px; padding:2px 8px; border-radius:6px;
    }

    .btn-del {
      flex-shrink:0; width:30px; height:30px; border-radius:8px; border:none;
      background:rgba(255,59,48,.1); color:#ff3b30; cursor:pointer; -webkit-appearance:none;
      display:flex; align-items:center; justify-content:center; transition:background .15s, transform .1s;
    }
    .btn-del:active { background:rgba(255,59,48,.22); transform:scale(.88); }

    /* ── TOAST ── */
    #toast {
      position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 22px);
      transform:translateX(-50%) translateY(90px);
      color:#fff; font-size:14px; font-weight:700;
      padding:11px 22px; border-radius:100px; z-index:999;
      white-space:nowrap; pointer-events:none;
      transition:transform .32s cubic-bezier(.34,1.56,.64,1);
      background:#22c55e;
    }
    #toast.show { transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <span class="header-title">Recordatorios</span>
    <span class="badge" id="badge">0 pendientes</span>
  </div>
</header>

<main>
  <!-- FORM -->
  <div class="form-card">
    <div class="field">
      <label class="field-label" for="inp-text">Recordatorio</label>
      <input type="text" id="inp-text" placeholder="¿Qué necesitas recordar?"
        autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false">
    </div>

    <div class="field">
      <label class="field-label">Categoría</label>
      <div class="cat-scroll" id="form-cats"></div>
    </div>

    <div class="field">
      <label class="field-label">Prioridad</label>
      <div class="pri-row">
        <button class="pri-btn active" data-pri="baja"  onclick="setPri('baja')">🔵 Baja</button>
        <button class="pri-btn"        data-pri="media" onclick="setPri('media')">🟠 Media</button>
        <button class="pri-btn"        data-pri="alta"  onclick="setPri('alta')">🔴 Alta</button>
      </div>
    </div>

    <div class="field" style="margin-bottom:0">
      <label class="field-label" for="inp-time">Hora (opcional)</label>
      <input type="time" id="inp-time">
    </div>
    <button class="btn-add" onclick="addItem()">＋ Agregar recordatorio</button>
  </div>

  <!-- FILTER -->
  <div class="filter-wrap">
    <div class="filter-label">Filtrar por categoría</div>
    <div class="cat-scroll" id="filter-cats"></div>
  </div>

  <!-- LIST -->
  <div class="section-header">
    <span class="section-title" id="section-title">Mis recordatorios</span>
    <button class="btn-clear" id="btn-clear" onclick="clearDone()" style="display:none">Limpiar completados</button>
  </div>
  <div id="list"></div>
</main>

<div id="toast"></div>

<script>
/* ── CONSTANTS ── */
const NTFY = 'https://ntfy.sh/recordatorios-edwin';
const KEY  = 'reminders_v5';

const CATS = [
  { id:'personal', label:'Personal', emoji:'🏠', color:'#6366f1' },
  { id:'trabajo',  label:'Trabajo',  emoji:'💼', color:'#3b82f6' },
  { id:'compras',  label:'Compras',  emoji:'🛒', color:'#22c55e' },
  { id:'salud',    label:'Salud',    emoji:'🏃', color:'#f97316' },
  { id:'otro',     label:'Otro',     emoji:'⭐', color:'#8b5cf6' },
];

const PRI_COLORS = { baja:'#6366f1', media:'#f97316', alta:'#ef4444' };
const PRI_LABEL  = { baja:'Baja',    media:'Media',    alta:'Alta'   };

/* ── STATE ── */
let items         = [];
let currentCat    = 'personal';
let currentPri    = 'baja';
let currentFilter = 'todas';

/* ── ICON: Ouroboros ── */
(function() {
  try {
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    const ctx = c.getContext('2d');
    const S = 512, cx = 256, cy = 256;

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(0,0,S,S,108); else ctx.rect(0,0,S,S);
    ctx.fill();

    const g = ctx.createLinearGradient(120,100,390,410);
    g.addColorStop(0,'#7c5df5'); g.addColorStop(1,'#5b8ef5');

    const R=152, BW=54, gap=0.20;
    const arcStart = -Math.PI/2 + gap;
    const arcEnd   = -Math.PI/2 + Math.PI*2 - gap;

    ctx.strokeStyle=g; ctx.lineWidth=BW; ctx.lineCap='butt';
    ctx.beginPath(); ctx.arc(cx,cy,R,arcStart,arcEnd,false); ctx.stroke();

    const hx = cx+Math.cos(arcEnd)*R, hy = cy+Math.sin(arcEnd)*R;
    const tangent = arcEnd+Math.PI/2;
    ctx.save(); ctx.fillStyle='#7c5df5';
    ctx.translate(hx,hy); ctx.rotate(tangent);
    ctx.beginPath(); ctx.ellipse(18,0,36,BW/2+4,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(46,-10,18,12,-0.3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(28,-14,7,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(30,-14,4,0,Math.PI*2); ctx.fill();
    ctx.restore();

    const tx=cx+Math.cos(arcStart)*R, ty=cy+Math.sin(arcStart)*R;
    const tailT=arcStart+Math.PI/2;
    ctx.save(); ctx.fillStyle='#5b8ef5';
    ctx.translate(tx,ty); ctx.rotate(tailT+Math.PI);
    ctx.beginPath(); ctx.moveTo(0,-BW/2+4); ctx.lineTo(22,0); ctx.lineTo(0,BW/2-4); ctx.closePath(); ctx.fill();
    ctx.restore();

    const eg=ctx.createLinearGradient(cx-12,cy-75,cx+12,cy+45);
    eg.addColorStop(0,'#7c5df5'); eg.addColorStop(1,'#5b8ef5');
    ctx.fillStyle=eg;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(cx-13,cy-72,26,82,13); else ctx.rect(cx-13,cy-72,26,82);
    ctx.fill();
    ctx.beginPath(); ctx.arc(cx,cy+26,15,0,Math.PI*2); ctx.fill();

    const url=c.toDataURL('image/png');
    ['apple-touch-icon','icon'].forEach(rel=>{ const l=document.createElement('link'); l.rel=rel; l.href=url; document.head.appendChild(l); });
  } catch(e){}
})();

/* ── STORAGE ── */
function load() {
  try { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch { items = []; }
  initCatPills();
  render();
}
function save() { localStorage.setItem(KEY, JSON.stringify(items)); }

/* ── INIT CAT PILLS ── */
function initCatPills() {
  renderFormCats();
  renderFilterCats();
}

function renderFormCats() {
  document.getElementById('form-cats').innerHTML = CATS.map(c => {
    const active = c.id === currentCat;
    const style = active ? `border-color:${c.color};color:${c.color};background:${c.color}22` : '';
    return `<button class="cat-pill" style="${style}" onclick="setCat('${c.id}')">${c.emoji} ${c.label}</button>`;
  }).join('');
}

function renderFilterCats() {
  const all = [{ id:'todas', label:'Todas', emoji:'🌐', color:'#8e8e93' }, ...CATS];
  document.getElementById('filter-cats').innerHTML = all.map(c => {
    const active = c.id === currentFilter;
    const style = active ? `border-color:${c.color};color:${c.color};background:${c.color}22` : '';
    return `<button class="cat-pill" style="${style}" onclick="setFilter('${c.id}')">${c.emoji} ${c.label}</button>`;
  }).join('');
}

/* ── CATEGORY / FILTER ── */
function setCat(id) {
  currentCat = id;
  renderFormCats();
}

function setFilter(id) {
  currentFilter = id;
  renderFilterCats();
  render();
}

/* ── PRIORITY ── */
function setPri(p) {
  currentPri = p;
  document.querySelectorAll('.pri-btn').forEach(b => b.classList.toggle('active', b.dataset.pri === p));
}

/* ── ADD ── */
async function addItem() {
  const inp = document.getElementById('inp-text');
  const txt = inp.value.trim();
  const time = document.getElementById('inp-time').value;
  if (!txt) {
    inp.classList.add('error'); inp.focus();
    setTimeout(() => inp.classList.remove('error'), 1600); return;
  }
  const item = { id:Date.now(), text:txt, time:time||null, category:currentCat, priority:currentPri, done:false };
  items.unshift(item); save(); render();
  inp.value = ''; document.getElementById('inp-time').value = '';
  document.activeElement?.blur();
  showToast('✓ Recordatorio agregado');
  sendNtfy(item);
}

/* ── NTFY ── */
async function sendNtfy(item) {
  try {
    const cat = CATS.find(c => c.id === item.category);
    const body = item.time ? `${item.text} — ${item.time}` : item.text;
    await fetch(NTFY, {
      method:'POST', body,
      headers:{
        'Title':`${cat ? cat.emoji+' '+cat.label : 'Recordatorio'}`,
        'Priority': item.priority==='alta'?'high':item.priority==='media'?'default':'low',
        'Content-Type':'text/plain; charset=utf-8'
      }
    });
  } catch(e) {}
}

/* ── TOGGLE / DELETE ── */
function toggleDone(id) {
  const it = items.find(i => i.id===id);
  if (it) { it.done=!it.done; save(); render(); }
}

function deleteItem(id) {
  const wrap = document.getElementById('wrap-'+id);
  if (wrap) {
    wrap.classList.add('removing');
    setTimeout(() => { items=items.filter(i=>i.id!==id); save(); render(); }, 210);
  } else { items=items.filter(i=>i.id!==id); save(); render(); }
}

function clearDone() { items=items.filter(i=>!i.done); save(); render(); }

/* ── SWIPE TO DELETE ── */
function setupSwipe(wrap, card, id) {
  let sx=0, sy=0, cx2=0, tracking=false, decided=false;
  wrap.addEventListener('touchstart', e => {
    sx=e.touches[0].clientX; sy=e.touches[0].clientY;
    cx2=0; tracking=true; decided=false; card.style.transition='none';
  }, {passive:true});
  wrap.addEventListener('touchmove', e => {
    if(!tracking) return;
    const dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy;
    if(!decided) { if(Math.abs(dy)>Math.abs(dx)+5){tracking=false;return;} if(Math.abs(dx)>8)decided=true; else return; }
    if(dx>=0) return;
    cx2=dx; card.style.transform=`translateX(${Math.max(dx,-130)}px)`;
    e.preventDefault();
  }, {passive:false});
  wrap.addEventListener('touchend', () => {
    if(!tracking) return; tracking=false;
    if(cx2<-80) {
      card.style.transition='transform .18s ease, opacity .18s ease';
      card.style.transform='translateX(-100%)'; card.style.opacity='0';
      setTimeout(()=>deleteItem(id),180);
    } else {
      card.style.transition='transform .3s cubic-bezier(.34,1.56,.64,1)';
      card.style.transform='translateX(0)';
    }
    cx2=0;
  });
}

/* ── TOAST ── */
let toastTimer;
function showToast(msg) {
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}

/* ── HELPERS ── */
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
const clockSVG=`<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`;
const trashSVG=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6M9 6V4h6v2"/></svg>`;
const trashW=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6M9 6V4h6v2"/></svg>`;

/* ── RENDER ── */
function render() {
  const listEl  = document.getElementById('list');
  const badgeEl = document.getElementById('badge');
  const clearEl = document.getElementById('btn-clear');
  const titleEl = document.getElementById('section-title');

  const filtered = currentFilter==='todas' ? items : items.filter(i=>(i.category||'personal')===currentFilter);
  const pending  = items.filter(i=>!i.done).length;

  badgeEl.textContent = `${pending} pendiente${pending!==1?'s':''}`;
  clearEl.style.display = items.some(i=>i.done)?'block':'none';

  if (currentFilter==='todas') {
    titleEl.textContent='Mis recordatorios';
  } else {
    const cat=CATS.find(c=>c.id===currentFilter);
    titleEl.textContent=cat?`${cat.emoji} ${cat.label}`:'Mis recordatorios';
  }

  if (filtered.length===0) {
    const isEmpty=items.length===0;
    listEl.innerHTML=`<div class="empty">
      <div class="empty-icon">${isEmpty?'📋':'🔍'}</div>
      <div class="empty-title">${isEmpty?'Sin recordatorios':'Nada aquí'}</div>
      <div class="empty-sub">${isEmpty?'Escribe algo arriba y toca Agregar':'No hay recordatorios en esta categoría'}</div>
    </div>`;
    return;
  }

  listEl.innerHTML=`<div class="list">${filtered.map(item=>{
    const cat=CATS.find(c=>c.id===(item.category||'personal'))||CATS[0];
    const pri=item.priority||'baja';
    const timePart=item.time?`<span class="card-time">${clockSVG}${item.time}</span>`:'';
    const catTag=`<span class="tag" style="color:${cat.color};background:${cat.color}22">${cat.emoji} ${cat.label}</span>`;
    const priTag=`<span class="tag" style="color:${PRI_COLORS[pri]};background:${PRI_COLORS[pri]}22">${PRI_LABEL[pri]}</span>`;
    const tags=item.done?'':`<div class="card-tags">${catTag}${priTag}${timePart?`<span class="card-time" style="margin-left:2px">${timePart}</span>`:''}</div>`;
    return `
      <div class="card-wrap" id="wrap-${item.id}">
        <div class="card-del-bg">${trashW}</div>
        <div class="card${item.done?' done':''}" data-pri="${pri}" id="card-${item.id}">
          <button class="btn-toggle" onclick="toggleDone(${item.id})" aria-label="${item.done?'Desmarcar':'Completar'}">
            ${item.done?'✓':''}
          </button>
          <div class="card-content">
            <div class="card-text">${esc(item.text)}</div>
            ${tags}
          </div>
          <button class="btn-del" onclick="deleteItem(${item.id})" aria-label="Eliminar">${trashSVG}</button>
        </div>
      </div>`;
  }).join('')}</div>`;

  filtered.forEach(item=>{
    const wrap=document.getElementById('wrap-'+item.id);
    const card=document.getElementById('card-'+item.id);
    if(wrap&&card) setupSwipe(wrap,card,item.id);
  });
}

/* ── ENTER KEY ── */
document.getElementById('inp-text').addEventListener('keydown',e=>{if(e.key==='Enter')addItem();});

/* ── INIT ── */
load();
</script>
</body>
</html>
